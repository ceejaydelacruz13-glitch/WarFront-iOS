  <head><script>
try {
  const ratio = Math.min(window.devicePixelRatio || 1, 1);
  Object.defineProperty(window, 'devicePixelRatio', {get: () => ratio});
} catch (_) {}
(() => {
  const sheets = new Set(["/tiles/buildings-top.png"]);
  const proto = HTMLImageElement.prototype;
  const src = Object.getOwnPropertyDescriptor(proto, 'src');
  const scaled = new WeakSet();
  Object.defineProperty(proto, 'src', {...src, set(value) {
    const url = new URL(value, document.baseURI);
    if (url.origin === location.origin && sheets.has(url.pathname)) {
      scaled.add(this);
      url.pathname = '/mobile' + url.pathname;
      src.set.call(this, url.href);
    } else {
      scaled.delete(this);
      src.set.call(this, value);
    }
  }});
  for (const prop of ['naturalWidth', 'naturalHeight']) {
    const spec = Object.getOwnPropertyDescriptor(proto, prop);
    Object.defineProperty(proto, prop, {...spec, get() {
      return spec.get.call(this) * (scaled.has(this) ? 4 : 1);
    }});
  }
  const context = CanvasRenderingContext2D.prototype;
  const draw = context.drawImage;
  context.drawImage = function(image, ...args) {
    if (scaled.has(image)) {
      if (args.length === 8) {
        for (let i = 0; i < 4; i++) args[i] /= 4;
      } else if (args.length === 2) {
        args.push(image.naturalWidth, image.naturalHeight);
      }
    }
    return draw.call(this, image, ...args);
  };
})();
function reportGameError(message) {
  if (!document.body || document.getElementById('warfront-error')) return;
  const box = document.createElement('pre');
  box.id = 'warfront-error';
  box.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#211;color:white;padding:10px;white-space:pre-wrap;z-index:2147483647;pointer-events:none';
  box.textContent = String(message).slice(0, 500);
  document.body.appendChild(box);
}
window.addEventListener('error', e => { if (e.message) reportGameError(e.message); });
window.addEventListener('unhandledrejection', e => reportGameError(e.reason));
</script>
